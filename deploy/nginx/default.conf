# MEHR AI Production Nginx Configuration
# Supports mehr-domain.uz, api.mehr-domain.uz, admin.mehr-domain.uz

upstream backend_cluster {
    server backend:5000;
    keepalive 32;
}

upstream frontend_cluster {
    server frontend:80;
}

# 1. API Subdomain (api.mehr-domain.uz)
server {
    listen 80;
    server_name api.mehr.uz api.mehr-ai.uz api.localhost;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Main Web & PWA Portal (mehr-domain.uz & admin.mehr-domain.uz)
server {
    listen 80;
    server_name mehr.uz mehr-ai.uz admin.mehr.uz localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Static caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API Proxy pass
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
