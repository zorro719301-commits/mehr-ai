version: '3.8'

services:
  # 1. PostgreSQL Database (Not exposed to public internet)
  postgres:
    image: postgres:16-alpine
    container_name: mehr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mehr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mehr_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mehr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mehr_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mehr_user -d mehr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mehr_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - mehr_internal_net

  # 3. MEHR AI Backend API
  backend:
    build:
      context: ./server
      dockerfile: ../deploy/Dockerfile.server
    container_name: mehr_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mehr_user}:${POSTGRES_PASSWORD:-mehr_secret_2026}@postgres:5432/${POSTGRES_DB:-mehr_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-mehr_jwt_super_secret_key_2026_clinical_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-mehr_jwt_refresh_super_secret_key_2026}
      CORS_ORIGIN: "https://mehr.uz,https://admin.mehr.uz,http://localhost"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mehr_internal_net

  # 4. MEHR AI Frontend & PWA
  frontend:
    build:
      context: ./client
      dockerfile: ../deploy/Dockerfile.client
    container_name: mehr_frontend
    restart: always
    networks:
      - mehr_internal_net

  # 5. Reverse Proxy & SSL Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: mehr_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mehr_internal_net

networks:
  mehr_internal_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
